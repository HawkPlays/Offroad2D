      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/lockthediff.keystore

      - name: Configure signing & versionCode
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'EOF'
          import os, re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              src = f.read()

          run_num = int(os.environ["RUN_NUMBER"])
          src = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", src, count=1)

          signing_block = """
          signingConfigs {
              release {
                  storeFile file("lockthediff.keystore")
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          """
          src = src.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
          src = src.replace(
              "release {\n            minifyEnabled false",
              "release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
              1,
          )
          with open(path, "w") as f:
              f.write(src)
          EOF

      - name: Build & sign APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease
