name: Build Debug APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Stage game files into www
        run: |
          mkdir -p www
          cp -r index.html style.css content.json manifest.webmanifest engine fonts levels sfx vehicles www/
      - name: Install Capacitor & build debug APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Upload LockTheDiff-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: LockTheDiff-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
