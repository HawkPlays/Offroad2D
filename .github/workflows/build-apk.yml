name: Build Signed APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Stage game files into www
        run: |
          mkdir -p www
          cp -r index.html style.css content.json manifest.webmanifest engine fonts levels sfx vehicles www/

      - name: Install Capacitor & configure landscape Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/lockthediff.keystore

      - name: Configure signing & versionCode
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'EOF'
          import os, re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              src = f.read()

          run_num = int(os.environ["RUN_NUMBER"])
          src = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", src, count=1)

          signing_block = """
          signingConfigs {
              release {
                  storeFile file("lockthediff.keystore")
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          """
          src = src.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
          src = src.replace(
              "release {\n            minifyEnabled false",
              "release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
              1,
          )
          with open(path, "w") as f:
              f.write(src)
          EOF

      - name: Build & sign APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease

      - name: Upload LockTheDiff-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: LockTheDiff-release
          path: android/app/build/outputs/apk/release/app-release.apk
